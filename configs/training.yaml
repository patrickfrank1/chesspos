# Ray training job config (consumed by src/run/train_ray.py --config).
# CLI flags override values set here; unset values fall back to code defaults.

training:
  data_repo: "patrickfrank1/chess-positions"   # HuggingFace dataset repo (required)
  data_limit_gb: null       # byte budget for the train split download
  data_cache: null          # cache dir for hub downloads (default: HF cache)

  upload_bucket: null       # e.g. "patrickfrank1/chesspos-checkpoints"
  upload_prefix: "checkpoints"
  mlflow_uri: null          # empty string ("") disables tracking explicitly
  mlflow_experiment: "chesspos"
  run_name: null

  steps: 10000
  batch_size: 8
  lr: 3.0e-4
  warmup: 500
  save_every: 2000
  eval_every: 1000

  num_training_workers: 1   # >1 enables DDP; requires inv_weight=0 and nce_weight=0
  use_gpu: null             # null = auto-detect CUDA
  storage_path: null        # Ray results/checkpoint path (shared FS for multi-node)

  # Harder MLM: rectangle masking over 30-50% of squares, synchronized across
  # the window's segments so adjacent positions cannot reveal masked squares.
  p_rect: 0.8
  p_random: 0.0
  p_board: 0.0
  p_span: 0.0
  # Default mixture: 80% rectangle + 20% skip-gram. Skip-gram leaves only a
  # small fraction of whole boards visible and masks every token of the rest.
  # Set both explicitly for a custom mix; setting one zeroes the other.
  p_skip_gram: 0.2
  skip_gram_unmask_rate: 0.10   # must be < 0.30
  rect_min_rate: 0.30
  rect_max_rate: 0.50
  rect_min_side: 2
  rect_max_side: 4
  rect_synchronize: true

  # Losses: MLM + context-removal invariance + strong VICReg + InfoNCE.
  # Defaults follow the 2026-10-25 tiny objective sweep: strong variance and
  # covariance regularization, a large context-removal invariance weight, and
  # a small InfoNCE term. Set all auxiliary weights to zero for the MLM-only
  # baseline.
  mlm_weight: 1.0
  inv_weight: 0.5
  var_weight: 1.0
  cov_weight: 0.1
  nce_weight: 0.1
  nce_temperature: 0.1
  aux_warmup: 200

  # Optional measurements at each eval.
  retrieval_benchmark: null       # e.g. "patrickfrank1/chess-positions"
  retrieval_benchmark_revision: null
  retrieval_batch_size: 128
  token_rank_tokens: 4096

  freq_weighting: true      # inverse-unigram-frequency loss weighting (train split only)
  freq_cap: 100.0           # cap on inverse-frequency weights (most frequent token = 1.0)
