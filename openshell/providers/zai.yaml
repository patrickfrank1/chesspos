id: zai
display_name: Z.AI
description: Z.AI inference API
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Z.AI API key
    env_vars: [ZAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.z.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/opencode]
